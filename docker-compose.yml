services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: examen_visitas
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      # Los scripts de db/ se ejecutan solo la primera vez (con el volumen vacío).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
